import java.util.jar.JarEntry
import java.util.jar.JarInputStream
import java.util.jar.JarOutputStream

ext {
    runDir = file("${projectDir}/run") as File
    assetsDir = file("${projectDir}/run/assets/virtual/legacy") as File
    nativesDir = file("${projectDir}/run/natives") as File

    def loaderIntermediaryJar = shadowJar.archiveFile.get().asFile.path.replace('-all.jar', '-all-intermediary.jar')
    def buildClasspath = { ->
        def classpathFiles = []
        // Use the intermediary-remapped jar if it exists (for runtime,
        // the game jar runs in intermediary namespace so the loader must
        // also use intermediary names — especially Mixin annotations).
        def jarFile = file(loaderIntermediaryJar)
        if (jarFile.exists()) {
            classpathFiles.add(jarFile)
        } else {
            classpathFiles.add(shadowJar.archiveFile.get().asFile)
        }
        classpathFiles.add(runConfig.localJar)
        classpathFiles.addAll(configurations.launchLibs.files)
        return files(classpathFiles)
    }

    runConfig = [
            localJar: file("libs/1.6.4-MITE.jar"),
            nativesDir: nativesDir,
            buildClasspath: buildClasspath,

            jvmArgs: [
                    "-Xmx2G",
                    "-Xms1G",
                    "-XX:+UseZGC",
                    "-XX:+UnlockExperimentalVMOptions",
                    "-XX:MaxGCPauseMillis=100",
                    "-XX:+DisableExplicitGC",
                    "-Dminecraft.client.jar=libs/1.6.4-MITE.jar",
                    "-Djava.library.path=${nativesDir.absolutePath}",
                    "-Dlog4j.configurationFile=log4j2.xml",
                    "-DLog4jContextSelector=org.apache.logging.log4j.core.selector.BasicContextSelector",
                    "-Dlog4j2.debug=false",
                    "-Dlog4j2.disableJmx=true",
                    "-Dlog4j2.skipJansi=true",
                    "-Dfabric.development=true"
            ],

            gameArgs: [
                    "--version", "1.6.4",
                    "--gameDir", runDir,
                    "--assetsDir", assetsDir,
                    "--accessToken", "0",
                    "--userProperties", "{}",
                    "--username", "${username}",
                    "--session", "a.a.a.a",
                    "--width", 854,
                    "--height", 480
            ],

            customLibs: configurations.launchLibs.files,

            workingDir: runDir,

            debug: true
    ]
}

tasks.register('cleanNatives', Delete) {
    delete runConfig.nativesDir
}

tasks.register('extractNatives', Copy) {
    dependsOn cleanNatives

    doFirst {
        runConfig.nativesDir.mkdirs()
    }

    from {
        configurations.natives.collect { zipTree(it) }
    }
    into runConfig.nativesDir

    include '**/*.dll'
    include '**/*.so'
    include '**/*.dylib'
    include '**/*.jnilib'

    exclude 'META-INF/**'
}

tasks.register('runClient', JavaExec) {
    group = 'fishmodloader'

    dependsOn extractNatives
    dependsOn buildJar
    dependsOn copyLogConfig

    mainClass = 'net.xiaoyu233.fml.relaunch.client.Main'
    // Lazily resolve classpath so buildJar (which produces the intermediary jar)
    // is guaranteed to have run before we pick which jar to use.
    classpath = project.layout.files(provider { runConfig.buildClasspath.call() })
    def jvmArgsList = new ArrayList(runConfig.jvmArgs as Collection)
    jvmArgsList.add("-Dlog.file.prefix=client")
    jvmArgs(jvmArgsList)

    args(runConfig.gameArgs)

    workingDir = runConfig.workingDir
}

tasks.register('runServer', JavaExec) {
    group = 'fishmodloader'

    dependsOn extractNatives
    dependsOn buildJar
    dependsOn copyLogConfig

    mainClass = 'net.xiaoyu233.fml.relaunch.server.Main'
    classpath = runConfig.buildClasspath.call()
    def jvmArgsList = new ArrayList(runConfig.jvmArgs as Collection)
    jvmArgsList.add("-Dlog.file.prefix=server")
    jvmArgs(jvmArgsList)

    args(runConfig.gameArgs)

    workingDir = runDir
}

tasks.register('showLaunchParams') {
    group = 'fishmodloader'

    doLast {
        def classpathFiles = [
                shadowJar.archiveFile.get().asFile,
                runConfig.localJar
        ]
        classpathFiles.addAll(runConfig.customLibs)

        classpathFiles.eachWithIndex { file, index ->
            println "  [${index + 1}] ${file.name} (${file.exists() ? 'exist' : 'doesNotExist'})"
        }
        println "java ${runConfig.jvmArgs.join(' ')} -cp ${classpathFiles.join(File.pathSeparator)} ${runConfig.mainClass} ${runConfig.gameArgs.join(' ')}"
    }
}

tasks.register('copyLogConfig', Copy) {
    from 'src/main/resources/log4j2.xml'
    into runConfig.workingDir

    doFirst {
        if (!runConfig.workingDir.exists()) {
            runConfig.workingDir.mkdirs()
        }
    }
}

def widenJar = file("${buildDir}/tmp/widen.jar")

// Namespace chain for the compile classpath:
//   libs/1.6.4-MITE.jar   (official / obfuscated: a.class, ...)
//     -> mite-intermediary.jar  via intermediary.tiny  (official -> intermediary)
//     -> mite-named.jar         via named.tiny         (intermediary -> named)
//     -> widen.jar              via fishmodloader.accesswidener
// FishModLoader sources and the accesswidener are written against *named*
// names, so the jar handed to javac must be named-namespace. Feeding the raw
// official jar here silently widens 0 classes and makes every net.minecraft.*
// import unresolvable.
def miteIntermediaryJarPath = file("${buildDir}/tmp/mite-intermediary.jar")
def miteNamedJar = file("${buildDir}/tmp/mite-named.jar")

configurations {
    widen {
        canBeResolved = true
        canBeConsumed = false
        description = 'MITE game jar with fishmodloader.accesswidener applied'
    }
}

tasks.register('remapMiteToNamed', JavaExec) {
    dependsOn project(':tools').tasks.named('compileJava')
    dependsOn 'remapMiteToIntermediary'
    group = 'forge-patching'

    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'org.moddedmite.fish.faloom.RemapIntermediaryToNamed'
    args = [
            miteIntermediaryJarPath.path,
            miteNamedJar.path,
            "${projectDir}/src/main/resources/named.tiny",
            // named.tiny stores descriptors in the official namespace, so the
            // official->intermediary table is needed to translate them.
            "${projectDir}/src/main/resources/intermediary.tiny"
    ]

    doFirst {
        file("${buildDir}/tmp").mkdirs()
    }
}

tasks.register('applyAccessWidener', JavaExec) {
    dependsOn project(':tools').tasks.named('compileJava')
    dependsOn 'remapMiteToNamed'
    group = 'fishmodloader'

    classpath = project(':tools').sourceSets.main.runtimeClasspath + configurations.shaded
    mainClass = 'org.moddedmite.fish.faloom.ApplyAccessWidener'
    args = [
            miteNamedJar.path,
            widenJar.path,
            "${projectDir}/src/main/resources/fishmodloader.accesswidener"
    ]

    // The MITE jar bundles ancient copies of Guava and Gson (EventBus without
    // SubscriberExceptionHandler, JsonParser without the static parseReader).
    // Because widen.jar comes first on the compile classpath, those shadow the
    // modern versions declared in build.gradle. Strip com/google/** so the
    // declared dependencies win.
    doLast {
        def stripped = file("${buildDir}/tmp/widen-stripped.jar")
        ant.delete(file: stripped.path, quiet: true)
        def removed = 0
        new java.util.zip.ZipOutputStream(stripped.newOutputStream()).withCloseable { zos ->
            new java.util.zip.ZipFile(widenJar).withCloseable { zf ->
                zf.entries().each { e ->
                    if (e.name.startsWith('com/google/')) { removed++; return }
                    zos.putNextEntry(new java.util.zip.ZipEntry(e.name))
                    if (!e.isDirectory()) zos << zf.getInputStream(e)
                    zos.closeEntry()
                }
            }
        }
        ant.move(file: stripped.path, tofile: widenJar.path)
        logger.lifecycle("Stripped ${removed} bundled com/google/** entries from widen.jar")
    }
}

dependencies {
    widen files(widenJar)
}

sourceSets.main.compileClasspath = configurations.widen + sourceSets.main.compileClasspath.filter {
    it.name != '1.6.4-MITE.jar'
}
tasks.named('compileJava') { dependsOn applyAccessWidener }

def mappingFile = file("${buildDir}/tmp/named2intermediary.tiny")
def refmapFile = file("${buildDir}/tmp/mixin.refmap.json")

tasks.register('genNamed2IntermediaryTiny', JavaExec) {
    group = 'fishmodloader'

    dependsOn shadowJar

    classpath = project(':tools').sourceSets.main.runtimeClasspath + files(sourceSets.main.output.resourcesDir)
    mainClass = 'org.moddedmite.fish.faloom.NamedToIntermediaryTinyGenerator'
    args = ["${buildDir}/tmp/named2intermediary.tiny"]

    doFirst {
        file("${buildDir}/tmp").mkdirs()
    }
}

tasks.register('genMixinRefmap', JavaExec) {
    group = 'fishmodloader'

    dependsOn genNamed2IntermediaryTiny
    dependsOn remapLoaderJar

    classpath = project(':tools').sourceSets.main.runtimeClasspath + files(sourceSets.main.output.resourcesDir)
    mainClass = 'org.moddedmite.fish.faloom.MixinRefmapGenerator'
    args = [
            shadowJar.archiveFile.get().asFile.path,
            mappingFile.path,
            refmapFile.path
    ]

    doFirst {
        file("${buildDir}/tmp").mkdirs()
    }

    doLast {
        def intermediaryJar = file(shadowJar.archiveFile.get().asFile.path.replace('-all.jar', '-all-intermediary.jar'))
        def tempFile = new File(intermediaryJar.parentFile, intermediaryJar.name + '.embed.tmp')
        try {
            def jis = new JarInputStream(new FileInputStream(intermediaryJar))
            def jos = new JarOutputStream(new FileOutputStream(tempFile))

            JarEntry entry
            while ((entry = jis.nextJarEntry) != null) {
                if (entry.name == 'mixin.refmap.json') continue
                jos.putNextEntry(entry)
                if (!entry.directory) {
                    jis.transferTo(jos)
                }
                jos.closeEntry()
            }
            jis.close()

            jos.putNextEntry(new JarEntry('mixin.refmap.json'))
            jos.write(refmapFile.bytes)
            jos.closeEntry()
            jos.close()

            intermediaryJar.delete()
            tempFile.renameTo(intermediaryJar)
        } catch (Exception e) {
            tempFile.delete()
            throw new RuntimeException("Failed to embed refmap into " + intermediaryJar, e)
        }
    }
}

tasks.register('remapLoaderJar', JavaExec) {
    group = 'fishmodloader'

    dependsOn genNamed2IntermediaryTiny
    dependsOn 'remapMiteToNamed'

    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'org.moddedmite.fish.faloom.LoaderRemapper'
    args = [
            shadowJar.archiveFile.get().asFile.path,
            mappingFile.path,
            shadowJar.archiveFile.get().asFile.path.replace('-all.jar', '-all-intermediary.jar'),
            mappingFile.path,
            // Game jar in the *named* namespace: the loader's own bytecode is
            // compiled against named names, so this is what lets tiny-remapper
            // resolve member owners and actually apply the renames.
            miteNamedJar.path
    ]
}

// Remap fishmodloader.accesswidener named -> intermediary and replace the copy
// embedded in the intermediary loader jar. AccessWidener matches members by
// name, so shipping the named-namespace file widens nothing at runtime and
// MITE's cross-package accesses fail with IllegalAccessError.
def remappedAwFile = file("${buildDir}/tmp/fishmodloader-intermediary.accesswidener")

tasks.register('remapAccessWidener', JavaExec) {
    group = 'fishmodloader'

    dependsOn genNamed2IntermediaryTiny
    // The named jar supplies the class hierarchy: an AW entry may name a
    // subclass as owner while named.tiny only carries the member under the
    // superclass that vanilla declares it on. Without the hierarchy those
    // entries pass through in named form and widen nothing at runtime.
    dependsOn 'remapMiteToNamed'

    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'org.moddedmite.fish.faloom.RemapAccessWidener'
    args = [
            "${projectDir}/src/main/resources/fishmodloader.accesswidener",
            remappedAwFile.path,
            mappingFile.path,
            miteNamedJar.path
    ]
}

tasks.register('embedRemappedAccessWidener') {
    group = 'fishmodloader'

    dependsOn remapAccessWidener
    dependsOn remapLoaderJar
    // genMixinRefmap rewrites the same jar; must not interleave with this task.
    mustRunAfter genMixinRefmap

    doLast {
        def jar = file(shadowJar.archiveFile.get().asFile.path.replace('-all.jar', '-all-intermediary.jar'))
        def tmp = new File(jar.parentFile, jar.name + '.aw.tmp')
        def awBytes = remappedAwFile.bytes
        new java.util.zip.ZipOutputStream(tmp.newOutputStream()).withCloseable { zos ->
            new java.util.zip.ZipFile(jar).withCloseable { zf ->
                zf.entries().each { e ->
                    if (e.name == 'fishmodloader.accesswidener') return
                    zos.putNextEntry(new java.util.zip.ZipEntry(e.name))
                    if (!e.isDirectory()) zos << zf.getInputStream(e)
                    zos.closeEntry()
                }
            }
            zos.putNextEntry(new java.util.zip.ZipEntry('fishmodloader.accesswidener'))
            zos.write(awBytes)
            zos.closeEntry()
        }
        ant.move(file: tmp.path, tofile: jar.path)
        logger.lifecycle("Embedded intermediary accessWidener into ${jar.name}")
    }
}

tasks.register('buildJar') {
    group = 'fishmodloader'

    dependsOn shadowJar
    dependsOn genNamed2IntermediaryTiny
    dependsOn remapLoaderJar
    dependsOn genMixinRefmap
    dependsOn embedRemappedAccessWidener
}

tasks.withType(JavaExec).configureEach { task ->
    if (task.name.startsWith('launch')) {
        task.dependsOn extractNatives
    }
}

// ====== ForgeGradle-style patching pipeline ======

def miteIntermediaryJar = file("${buildDir}/tmp/mite-intermediary.jar")
def miteDecompiledDir = file("${buildDir}/tmp/mite-src")

tasks.register('remapMiteToIntermediary', JavaExec) {
    dependsOn project(':tools').tasks.named('compileJava')
    group = 'forge-patching'

    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'org.moddedmite.fish.faloom.RemapToIntermediary'
    args = [
            file('libs/1.6.4-MITE.jar').path,
            miteIntermediaryJar.path,
            "${projectDir}/src/main/resources/intermediary.tiny"
    ]

    doFirst {
        file("${buildDir}/tmp").mkdirs()
    }
}

tasks.register('decompileMiteJar', JavaExec) {
    dependsOn remapMiteToIntermediary
    group = 'forge-patching'

    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'org.benf.cfr.reader.Main'
    args = [
            miteIntermediaryJar.path,
            "--outputdir", miteDecompiledDir.path,
            "--silent", "true",
            "--caseinsensitivefs", "false",
            "--hideutf", "true"
    ]

    doFirst {
        miteDecompiledDir.deleteDir()
        miteDecompiledDir.mkdirs()
    }

    doLast {
        println "Decompiled source written to " + miteDecompiledDir
    }
}

// Raise javac's error cap so verification runs report true totals
// (default is 100, which saturates and hides real progress).
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xmaxerrs', '2000']
}

// Run the JVM verifier over every class of the runtime game jar with the
// remapped accessWidener applied. Catches VerifyError/IllegalAccessError that
// only surface at class-definition time -- the MITE namespace splits classes
// that shared the default package into separate packages, which turns legal
// protected accesses illegal. tiny-remapper's fixPackageAccess does NOT cover
// this: it implements JVMS 5.4.4 (resolution) but not 4.10.1.8 (verification).
//
//   ./gradlew verifyGameJar -PgameJar=<path to remapped jar>
tasks.register('verifyGameJar', JavaExec) {
    group = 'fishmodloader'
    description = 'Verify every class in the remapped game jar with the AW applied'

    dependsOn remapAccessWidener

    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'org.moddedmite.fish.faloom.VerifyGameJar'
    args = [
            project.findProperty('gameJar') ?: miteIntermediaryJar.path,
            project.findProperty('awFile') ?: remappedAwFile.path
    ]
    // -Ptrace=<substring> prints the full throwable for matching classes,
    // which is how you tell a real VerifyError apart from a missing-dependency
    // cascade in the supertype chain.
    if (project.hasProperty('trace')) {
        systemProperty 'verify.trace', project.property('trace')
    }
}


// This probe runs on sourceSets.main.runtimeClasspath (named namespace) and
// validates AT parsing, mapping decisions, discovery, and direct ASM flag changes.
// The intermediary classloader/runtime chain is covered by the server E2E below.
tasks.register('probeForgeAccessTransformer', JavaExec) {
    group = 'verification'
    description = 'Probe Forge AT parsing, mapping, discovery, and ASM behavior on the named classpath'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.xiaoyu233.fml.modfixer.ForgeAccessTransformerProbe'
}

tasks.register('probeLegacyForgeModRemapper', JavaExec) {
    group = 'verification'
    description = 'Probe legacy Forge official-to-intermediary jar remapping, namespace scanning, and caching'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.xiaoyu233.fml.modfixer.LegacyForgeModRemapperProbe'
    jvmArgs '--add-modules=jdk.zipfs'
}

// A real legacy Forge mod fixture. Its target class is deliberately absent from
// the mod entrypoint's symbolic references and is first loaded by name during
// FMLServerStartedEvent, after ForgeModDiscoverer has imported META-INF/fixture_at.cfg.
// Keeping its sources outside sourceSets.main prevents test-only code entering
// the loader jar; the generated binary remains under ignored build/.
def forgeAtFixtureSourceDir = file('src/integrationTest/forgeAt/java')
def forgeAtFixtureResourcesDir = file('src/integrationTest/forgeAt/resources')
def forgeAtFixtureClassesDir = file("${buildDir}/forge-at-fixture/classes")
def forgeAtFixtureJarFile = file("${buildDir}/forge-at-fixture/forge-at-fixture.jar")

tasks.register('compileForgeAtFixture', JavaCompile) {
    group = 'verification'
    description = 'Compile the real Forge AT integration fixture mod'
    dependsOn classes
    source = fileTree(forgeAtFixtureSourceDir) { include '**/*.java' }
    destinationDirectory = forgeAtFixtureClassesDir
    classpath = sourceSets.main.output + sourceSets.main.compileClasspath
    options.release = 8
    options.encoding = 'UTF-8'
}

tasks.register('forgeAtFixtureJar', Jar) {
    group = 'verification'
    description = 'Package the Forge AT fixture with @Mod, manifest FMLAT, and META-INF/*_at.cfg'
    dependsOn compileForgeAtFixture
    archiveFileName = forgeAtFixtureJarFile.name
    destinationDirectory = forgeAtFixtureJarFile.parentFile
    from forgeAtFixtureClassesDir
    from forgeAtFixtureResourcesDir
    manifest {
        attributes 'Manifest-Version': '1.0', 'FMLAT': 'fixture_at.cfg'
    }
}


// Synthetic official-namespace Forge mod lifecycle fixture. Generated from ASM,
// never from or with a third-party mod binary.
def forgeRemapFixtureJarFile = file("${buildDir}/forge-remap-fixture/forge-remap-fixture.jar")

tasks.register('forgeRemapFixtureJar', JavaExec) {
    group = 'verification'
    description = 'Generate the synthetic official Forge remap lifecycle fixture'
    dependsOn classes
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.xiaoyu233.fml.modfixer.LegacyForgeModRemapperProbe'
    args forgeRemapFixtureJarFile.path
}

tasks.register('verifyForgeModRemapIntegration') {
    group = 'verification'
    description = 'Start a server and assert official Forge mod remap plus full lifecycle'
    dependsOn buildJar, tasks.named('forgeRemapFixtureJar')
    doLast {
        def stage=file("${buildDir}/forge-remap-server-e2e")
        def loader=file(shadowJar.archiveFile.get().asFile.path.replace('-all.jar','-all-intermediary.jar'))
        delete stage; file("${stage}/mods").mkdirs()
        copy { from forgeRemapFixtureJarFile; into file("${stage}/mods") }
        copy { from loader; into stage }
        copy { from runConfig.localJar; into stage; rename { 'MITE-HDS.jar' } }
        copy { from 'src/main/resources/log4j2.xml'; into stage }
        file("${stage}/eula.txt").text='eula=true\n'
        def javaExecutable=new File(System.getProperty('java.home'),'bin/java'+(org.gradle.internal.os.OperatingSystem.current().isWindows()?'.exe':''))
        def command=[javaExecutable.absolutePath,'-Xmx1G','-Xms512M','-Dlog4j.configurationFile=log4j2.xml','-DLog4jContextSelector=org.apache.logging.log4j.core.selector.BasicContextSelector','-Dlog4j2.disableJmx=true','-Dlog4j2.skipJansi=true','-cp',new File(stage,loader.name).absolutePath,'net.xiaoyu233.fml.relaunch.server.JarMain','nogui']
        def process=new ProcessBuilder(command).directory(stage).redirectErrorStream(true).start()
        def output=new StringBuffer();def done=new java.util.concurrent.atomic.AtomicBoolean(false);def post=new java.util.concurrent.atomic.AtomicBoolean(false);def stopped=new java.util.concurrent.atomic.AtomicBoolean(false)
        def reader=Thread.start('forge-remap-server-output'){process.inputStream.withReader('UTF-8'){stream->String line;while((line=stream.readLine())!=null){synchronized(output){output.append(line).append('\n')};println line;if(line.contains('Done ('))done.set(true);if(line.contains('Dispatched Forge INIT/POSTINIT/AVAILABLE to 1 mod(s)'))post.set(true);if(done.get()&&post.get()&&stopped.compareAndSet(false,true)){process.outputStream.write('stop\n'.getBytes('UTF-8'));process.outputStream.flush()}}}}
        boolean exited=process.waitFor(180,java.util.concurrent.TimeUnit.SECONDS);if(!exited)process.destroyForcibly();reader.join(5000);file("${stage}/server-e2e.log").text=output.toString()
        if(!exited||process.exitValue()!=0)throw new GradleException('Forge remap fixture server failed or timed out')
        def text=output.toString();['Forge mod namespace: OFFICIAL','Remapped Forge mod','Constructed Forge mod: forge_remap_fixture','Forge mod construction complete: 1 active mod(s)','Dispatching cpw.mods.fml.common.event.FMLPreInitializationEvent to 1 handler(s) on Forge mod forge_remap_fixture','Dispatching cpw.mods.fml.common.event.FMLInitializationEvent to 1 handler(s) on Forge mod forge_remap_fixture','Dispatching cpw.mods.fml.common.event.FMLPostInitializationEvent to 1 handler(s) on Forge mod forge_remap_fixture','Done ('].each{needle->if(!text.contains(needle))throw new GradleException('Missing Forge remap assertion: '+needle)}
        if(text.contains('NoClassDefFoundError: aqz')||text.contains('ClassNotFoundException: aqz'))throw new GradleException('Official aqz reference reached runtime')
        logger.lifecycle('Forge mod remap lifecycle verification passed; log: '+file("${stage}/server-e2e.log"))
    }
}

tasks.register('verifyForgeAccessTransformerServer') {
    group = 'verification'
    description = 'Start a real Forge mod server, assert AT application in its lifecycle, then stop it'
    dependsOn buildJar, tasks.named('forgeAtFixtureJar')

    doLast {
        def stage = file("${buildDir}/forge-at-server-e2e")
        def loaderIntermediaryJarFile = file(shadowJar.archiveFile.get().asFile.path.replace('-all.jar', '-all-intermediary.jar'))
        def miteJarFile = runConfig.localJar
        delete stage
        file("${stage}/mods").mkdirs()
        copy { from forgeAtFixtureJarFile; into file("${stage}/mods") }
        copy { from loaderIntermediaryJarFile; into stage }
        copy { from miteJarFile; into stage; rename { 'MITE-HDS.jar' } }
        copy { from 'src/main/resources/log4j2.xml'; into stage }
        file("${stage}/eula.txt").text = 'eula=true\n'

        def loaderJar = file("${stage}/${loaderIntermediaryJarFile.name}")
        def javaExecutable = new File(System.getProperty('java.home'), 'bin/java' + (org.gradle.internal.os.OperatingSystem.current().isWindows() ? '.exe' : ''))
        def command = [javaExecutable.absolutePath, '-Xmx1G', '-Xms512M',
                       '-Dlog4j.configurationFile=log4j2.xml',
                       '-DLog4jContextSelector=org.apache.logging.log4j.core.selector.BasicContextSelector',
                       '-Dlog4j2.disableJmx=true', '-Dlog4j2.skipJansi=true',
                       '-cp', loaderJar.absolutePath,
                       'net.xiaoyu233.fml.relaunch.server.JarMain', 'nogui']
        logger.lifecycle('Starting Forge AT server fixture: ' + command.join(' '))

        def process = new ProcessBuilder(command).directory(stage).redirectErrorStream(true).start()
        def done = new java.util.concurrent.atomic.AtomicBoolean(false)
        def assertion = new java.util.concurrent.atomic.AtomicBoolean(false)
        def stopSent = new java.util.concurrent.atomic.AtomicBoolean(false)
        def output = new StringBuffer()
        def reader = Thread.start('forge-at-server-output') {
            process.inputStream.withReader('UTF-8') { stream ->
                String line
                while ((line = stream.readLine()) != null) {
                    synchronized (output) { output.append(line).append('\n') }
                    println line
                    if (line.contains('Done (')) done.set(true)
                    if (line.contains('[Forge AT fixture] ASSERTION PASSED')) assertion.set(true)
                    if (done.get() && assertion.get() && stopSent.compareAndSet(false, true)) {
                        try {
                            process.outputStream.write('stop\n'.getBytes('UTF-8'))
                            process.outputStream.flush()
                        } catch (IOException stopFailure) {
                            logger.warn('Could not send stop to Forge AT fixture server', stopFailure)
                        }
                    }
                }
            }
        }

        boolean exited = process.waitFor(180, java.util.concurrent.TimeUnit.SECONDS)
        if (!exited) {
            process.destroyForcibly()
            reader.join(5000)
            file("${stage}/server-e2e.log").text = output.toString()
            throw new GradleException('Forge AT server fixture timed out after 180 seconds')
        }
        reader.join(5000)
        file("${stage}/server-e2e.log").text = output.toString()
        if (process.exitValue() != 0) throw new GradleException("Forge AT server exited with ${process.exitValue()}")
        if (!done.get()) throw new GradleException('Forge AT server never logged Done')
        if (!assertion.get()) throw new GradleException('Forge AT lifecycle assertion did not pass')
        def text = output.toString()
        if (!text.contains('Forge AT rules loaded:')) throw new GradleException('Forge AT rules-loaded log is missing')
        if (!text.contains('[AT] Applied')) throw new GradleException('FMLClassTransformer AT-applied log is missing')
        logger.lifecycle('Forge AT server end-to-end verification passed; log: ' + file("${stage}/server-e2e.log"))
    }
}

tasks.register('verifyOverwrites', JavaExec) {
    group = 'fishmodloader'
    description = 'Verify @Shadow/@Overwrite targets exist in the remapped MITE jar (with full descriptor check)'
    dependsOn ':tools:classes', remapMiteToNamed
    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'org.moddedmite.fish.faloom.VerifyOverwrites'
    args = [
            project.findProperty('gameJar') ?: file('build/tmp/mite-named.jar').path
    ]
}

tasks.register('verifyInjections', JavaExec) {
    group = 'fishmodloader'
    description = 'Detect self-recursive @Inject, @Shadow descriptor mismatches, and missing @Inject targets'
    dependsOn ':tools:classes', remapMiteToNamed
    classpath = project(':tools').sourceSets.main.runtimeClasspath
    mainClass = 'org.moddedmite.fish.faloom.VerifyInjections'
    args = [
            project.findProperty('gameJar') ?: file('build/tmp/mite-named.jar').path,
            'src/main/java/net/xiaoyu233/fml/reload/transform'
    ]
}

// Daily compatibility gate: build the runtime artifact and run every static or
// in-process probe. Keep the real server out of this graph so it stays suitable
// for routine development. Gradle de-duplicates the shared remap/compile/build
// prerequisites of these tasks.
tasks.register('verifyForgeCompatibilityQuick') {
    group = 'verification'
    description = 'Build and run Forge compatibility static checks and probes (no real server)'
    dependsOn buildJar
    dependsOn verifyGameJar
    dependsOn verifyOverwrites
    dependsOn verifyInjections
    dependsOn probeForgeAccessTransformer
    dependsOn probeLegacyForgeModRemapper
}

// The server E2E already depends on buildJar and its fixture. Depending on the
// quick aggregate adds all cheap gates without introducing another build path;
// shared tasks still execute only once in the Gradle task graph.
tasks.register('verifyForgeCompatibilityIntegration') {
    group = 'verification'
    description = 'Run the quick gate and the real Forge AT server end-to-end verification'
    dependsOn verifyForgeCompatibilityQuick
    dependsOn verifyForgeAccessTransformerServer
    dependsOn verifyForgeModRemapIntegration
}

// Stable top-level gate. It currently aliases integration; future client or
// real-mod automation belongs here without changing the documented entrypoint.
tasks.register('verifyForgeCompatibility') {
    group = 'verification'
    description = 'Run the complete Forge compatibility verification suite'
    dependsOn verifyForgeCompatibilityIntegration
}
