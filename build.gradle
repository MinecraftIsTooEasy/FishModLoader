def clientJavaCandidates = {
    def candidates = []
    def explicit = providers.gradleProperty('clientJava')
    if (explicit.isPresent()) {
        def explicitPath = file(explicit.get())
        candidates << (explicitPath.isDirectory() ? new File(explicitPath, 'bin/java') : explicitPath)
