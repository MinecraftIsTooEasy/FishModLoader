    candidates << new File(layout.projectDirectory.asFile, 'runtime/jre-17-x64/bin/java')
    candidates << new File(System.getProperty('java.home'), 'bin/java')
    candidates.unique { it.absolutePath }
}

/**
 * The installer uses LWJGL 2.9.2-nightly-20140822 on macOS.  Its native
 * library has a different JNI signature from the 2.9.0 classes stored in
 * libs.zip, so loading 2.9.0 Java classes with the installer's native library
 * can crash in MacOSXDisplay.nCreateWindow.  Prefer the matching installer
 * pair when it is present; the bundled 2.9.0 classes remain available for
 * Windows and for standalone builds that provide matching 2.9.0 natives.
 */
def clientLwjglJava = {
    def configured = providers.gradleProperty('lwjglDir')
    def roots = []
    if (configured.isPresent()) roots << file(configured.get())
    roots << defaultMinecraftLibrariesDir

    def nightlyRoot = { File root ->
        [
                new File(root, 'org/lwjgl/lwjgl/lwjgl/2.9.2-nightly-20140822/lwjgl-2.9.2-nightly-20140822.jar'),
                new File(root, 'org/lwjgl/lwjgl/lwjgl_util/2.9.2-nightly-20140822/lwjgl_util-2.9.2-nightly-20140822.jar')
        ]
    }
    def selected = roots.collect { nightlyRoot(it) }.find { pair -> pair.every { it.isFile() } }
    selected ?: []
}

