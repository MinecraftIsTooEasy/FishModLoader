def nativeLibraryNames = {
    def osName = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
    if (osName.contains('mac')) {
        return ['liblwjgl.dylib', 'openal.dylib', 'libjinput-osx.jnilib']
    }
    if (osName.contains('win')) {
        return ['lwjgl64.dll', 'OpenAL64.dll']
    }
    return ['liblwjgl.so', 'libopenal.so']
}

def commandResult = { List<String> command ->
    try {
        def process = new ProcessBuilder(command).redirectErrorStream(true).start()
        def output = process.inputStream.getText('UTF-8')
        def exitCode = process.waitFor()
        [exitCode: exitCode, output: output]
    } catch (Exception ignored) {
        [exitCode: -1, output: '']
    }
}

def hostIsAppleSilicon = {
    def osName = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
    def arch = System.getProperty('os.arch', '').toLowerCase(Locale.ROOT)
    osName.contains('mac') && (arch.contains('aarch64') || arch.contains('arm64'))
}

def javaArchitecture = { File javaExecutable ->
    if (!javaExecutable.isFile()) return ''
    def result = commandResult(['/usr/bin/file', javaExecutable.absolutePath])
    if (result.output.contains('arm64') || result.output.contains('aarch64')) return 'aarch64'
    if (result.output.contains('x86_64') || result.output.contains('x86-64')) return 'x86_64'
    ''
}

def javaMajorVersion = { File javaExecutable ->
    if (!javaExecutable.isFile()) return ''
    def result = commandResult([javaExecutable.absolutePath, '-version'])
    def match = result.output =~ /version\s+"(\d+)(?:\.(\d+))?/
    if (!match.find()) return ''
    match.group(1) == '1' ? match.group(2) : match.group(1)
}

def clientJavaIsSuitable = { File javaExecutable ->
    if (!javaExecutable.isFile() || !javaExecutable.canExecute()) return false
    if (javaMajorVersion(javaExecutable) != javaTarget.toString()) return false
    if (hostIsAppleSilicon()) return javaArchitecture(javaExecutable) == 'x86_64'
    true
}

def rosettaInstalled = {
    if (!hostIsAppleSilicon()) return true
    new File('/Library/Apple/usr/libexec/oah/libRosettaRuntime').isFile() ||
            commandResult(['/usr/bin/pgrep', '-q', 'oahd']).exitCode == 0
}

def clientRuntimeRoot = {
