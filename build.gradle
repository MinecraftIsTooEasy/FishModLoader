def sha256File = { File input ->
    def digest = MessageDigest.getInstance('SHA-256')
    input.withInputStream { stream ->
        byte[] buffer = new byte[1024 * 1024]
        int count
        while ((count = stream.read(buffer)) >= 0) {
            if (count > 0) digest.update(buffer, 0, count)
        }
    }
    digest.digest().collect { String.format('%02x', it & 0xff) }.join()
}

def downloadFile = { String sourceUrl, File destination ->
    destination.parentFile.mkdirs()
    def connection = new URL(sourceUrl).openConnection()
    connection.connectTimeout = 25000
    connection.readTimeout = 120000
    connection.setRequestProperty('User-Agent', 'FishModLoader-Gradle/1.0')
    connection.inputStream.withCloseable { input ->
        destination.withOutputStream { output -> input.transferTo(output) }
    }
}

def downloadPortableClientJre = {
    if (!rosettaInstalled()) {
        throw new GradleException('Apple Silicon requires Rosetta 2 for the x86_64 LWJGL natives. Install it with: softwareupdate --install-rosetta')
    }

    def runtimeRoot = clientRuntimeRoot()
    def target = new File(runtimeRoot, 'jre-17-x64')
    def tempRoot = new File(layout.buildDirectory.dir('tmp/client-jre').get().asFile, "jre-17-x64-${System.currentTimeMillis()}")
    def archive = new File(tempRoot, 'jre.tar.gz')
    def extracted = new File(tempRoot, 'extracted')
    tempRoot.mkdirs()
    extracted.mkdirs()

    try {
        def metadataUrl = 'https://api.azul.com/metadata/v1/zulu/packages/?java_version=17&os=macos&arch=x64&java_package_type=jre&archive_type=tar.gz&latest=true&release_status=ga&availability_types=CA'
        logger.lifecycle('Downloading portable x86_64 Java 17 from Azul Zulu...')
        def metadataConnection = new URL(metadataUrl).openConnection()
        metadataConnection.connectTimeout = 25000
        metadataConnection.readTimeout = 25000
        metadataConnection.setRequestProperty('User-Agent', 'FishModLoader-Gradle/1.0')
        def metadata = new JsonSlurper().parseText(metadataConnection.inputStream.getText('UTF-8'))
        def packageInfo = metadata instanceof List ? metadata[0] : metadata
        def downloadUrl = packageInfo.download_url?.toString()
        def packageUuid = packageInfo.package_uuid?.toString()
        if (!downloadUrl) throw new GradleException('Azul metadata did not provide a JRE download URL')

        def expectedSha = ''
        if (packageUuid) {
            try {
                def detailConnection = new URL("https://api.azul.com/metadata/v1/zulu/packages/${packageUuid}").openConnection()
                detailConnection.connectTimeout = 25000
                detailConnection.readTimeout = 25000
                detailConnection.setRequestProperty('User-Agent', 'FishModLoader-Gradle/1.0')
                def details = new JsonSlurper().parseText(detailConnection.inputStream.getText('UTF-8'))
                expectedSha = details.sha256_hash?.toString() ?: ''
            } catch (Exception ignored) {
                logger.lifecycle('Azul checksum metadata unavailable; continuing with archive validation after extraction.')
            }
        }

        downloadFile(downloadUrl, archive)
        if (expectedSha && sha256File(archive) != expectedSha.toLowerCase(Locale.ROOT)) {
            throw new GradleException('Downloaded x86_64 Java 17 archive failed SHA-256 verification')
        }
        exec {
            commandLine 'tar', '-xzf', archive.absolutePath, '-C', extracted.absolutePath
        }
        def javaFile = extracted.toPath().resolve('bin/java').toFile()
        if (!javaFile.isFile()) {
            def nested
            extracted.eachFileRecurse { candidate ->
                if (nested == null && candidate.name == 'java' && candidate.parentFile?.name == 'bin') nested = candidate
            }
            if (nested) javaFile = nested
        }
        if (!javaFile.isFile()) throw new GradleException('Downloaded archive does not contain a Java runtime')
        def sourceHome = javaFile.parentFile.parentFile
        if (target.exists()) target.deleteDir()
        project.copy { from sourceHome; into target }
        new File(target, 'bin/java').setExecutable(true)
        if (!clientJavaIsSuitable(new File(target, 'bin/java'))) {
            throw new GradleException("Downloaded Java runtime is not a usable x86_64 Java ${javaTarget}")
        }
        logger.lifecycle("Portable x86_64 Java ${javaTarget} installed at ${target}")
        new File(target, 'bin/java')
    } finally {
        tempRoot.deleteDir()
    }
}

def resolveClientJava = {
    def candidates = clientJavaCandidates()
    def found = candidates.find { clientJavaIsSuitable(it) }
    if (found) return found
    if (hostIsAppleSilicon()) return downloadPortableClientJre()
    def current = new File(System.getProperty('java.home'), 'bin/java')
    throw new GradleException("runClient requires Java ${javaTarget}; no suitable Java was found. Set JAVA_HOME or -PclientJava=/path/to/java (current: ${current})")
}

def runtimeClasspath = {
    files(
        shadowJar.flatMap { it.archiveFile },
        legacyFile('MITE-HDS.jar'),
        legacyFile('1.6.4-MITE.jar')
    )
}

// The client must see the original MITE font.txt before FML's resource. The
// MITE FontRenderer indexes a 256-entry width table using that resource's
// character list; putting the FML CJK font first crashes the language screen.
def clientRuntimeClasspath = {
    def lwjglJava = clientLwjglJava()
    files(
        legacyFile('1.6.4-MITE.jar'),
        clientExternalLibraries(),
        lwjglJava,
        shadowJar.flatMap { it.archiveFile },
        legacySupportJar.flatMap { it.archiveFile }
    )
}

def prepareRunDir = tasks.register('prepareRunDir') {
    group = 'run'
    description = 'Create the working directory used by the legacy game tasks.'
    outputs.dir(layout.projectDirectory.dir('run'))
    doLast {
        layout.projectDirectory.dir('run').asFile.mkdirs()
    }
}

tasks.register('runServer', JavaExec) {
    group = 'run'
    description = 'Run the FishModLoader server entry point with the legacy MITE runtime.'
    dependsOn(shadowJar, prepareLegacyLibs, prepareRunDir)
    classpath = runtimeClasspath()
    mainClass = 'net.xiaoyu233.fml.relaunch.server.Main'
    workingDir = layout.projectDirectory.dir('run').asFile
    systemProperty 'minecraft.client.jar', layout.buildDirectory.file('legacy-libs/1.6.4-MITE.jar').get().asFile
    systemProperty 'log4j.configurationFile', 'log4j2.xml'
    jvmArgs '-Dfabric.development=true'
}

tasks.register('runClient', Exec) {
    group = 'run'
    description = 'Run the FishModLoader client entry point with the legacy MITE runtime.'
    dependsOn(shadowJar, legacySupportJar, prepareLegacyLibs, extractNatives, prepareRunDir)
    workingDir = layout.projectDirectory.dir('run').asFile
    doFirst {
        if (hostIsAppleSilicon() && !rosettaInstalled()) {
            throw new GradleException('Apple Silicon requires Rosetta 2 for the x86_64 LWJGL natives. Install it with: softwareupdate --install-rosetta')
        }
        def clientJava = resolveClientJava()
        executable = clientJava.absolutePath
        logger.lifecycle("Using client Java ${javaMajorVersion(clientJava)} (${javaArchitecture(clientJava)}): ${clientJava}")
        def nativeDir = clientNativeDir()
        def missingNative = nativeLibraryNames().findAll { !new File(nativeDir, it).isFile() }
        if (!missingNative.empty) {
            throw new GradleException("Missing client native libraries in ${nativeDir}: ${missingNative.join(', ')}. On Apple Silicon, use the x86_64 LWJGL natives with an x86_64 Java under Rosetta.")
        }
        def availableClientLibraries = clientExternalLibraries()
        def missingClientLibraries = requiredClientLibraryNames.findAll { required ->
            !availableClientLibraries.any { it.name == required }
        }
        if (!missingClientLibraries.empty) {
            throw new GradleException("Missing Minecraft client libraries in ${defaultMinecraftLibrariesDir}: ${missingClientLibraries.join(', ')}. Run /Users/postyizhan/code/MITE-Installer/install.sh first, or set -PminecraftLibrariesDir=/path/to/libraries.")
        }
        def osName = System.getProperty('os.name', '').toLowerCase(Locale.ROOT)
        if (osName.contains('mac') && javaArchitecture(clientJava) == 'x86_64') {
            def incompatible = nativeLibraryNames().findAll { nativeName ->
                !commandResult(['/usr/bin/file', new File(nativeDir, nativeName).absolutePath]).output.contains('x86_64')
            }
        if (!incompatible.empty) {
                throw new GradleException("The macOS natives in ${nativeDir} do not contain x86_64 slices: ${incompatible.join(', ')}. Provide the 1.6.4 x86_64 natives with -PnativeDir=...")
            }
        }
        def gameDir = providers.gradleProperty('gameDir').map { file(it) }.getOrElse(defaultClientGameDir)
        def assetsDir = providers.gradleProperty('assetsDir').map { file(it) }.getOrElse(new File(gameDir, 'assets/virtual/legacy'))
        def launchArgs = [
                '--username', providers.gradleProperty('username').getOrElse('Player'),
                '--session', providers.gradleProperty('session').getOrElse('0'),
                '--version', providers.gradleProperty('minecraftVersion').getOrElse('1.6.4-MITE'),
                '--gameDir', gameDir.absolutePath,
                '--assetsDir', assetsDir.absolutePath,
                '--accessToken', providers.gradleProperty('accessToken').getOrElse('0'),
                '--uuid', providers.gradleProperty('uuid').getOrElse('00000000-0000-0000-0000-000000000000'),
                '--width', providers.gradleProperty('width').getOrElse('854'),
                '--height', providers.gradleProperty('height').getOrElse('480')
        ]
        commandLine clientJava.absolutePath,
                '-Dfabric.development=true',
                '-Dfile.encoding=UTF-8',
                '-Duser.language=en',
                '-Duser.country=US',
                '-Dminecraft.client.jar=' + layout.buildDirectory.file('legacy-libs/1.6.4-MITE.jar').get().asFile.absolutePath,
                '-Dmixin.debug.countInjections=true',
                '-Djava.library.path=' + nativeDir.absolutePath,
                '-Dorg.lwjgl.librarypath=' + nativeDir.absolutePath,
                '-Dlog4j.configurationFile=log4j2.xml',
                '-cp', clientRuntimeClasspath().asPath,
                'net.xiaoyu233.fml.relaunch.client.Main'
        args launchArgs
    }
}

