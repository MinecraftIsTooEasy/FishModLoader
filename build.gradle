import groovy.json.JsonSlurper

import java.security.MessageDigest
import java.util.zip.ZipFile

plugins {
    id 'java'
    id 'application'
}

group = providers.gradleProperty('group').getOrElse('net.xiaoyu233')
version = providers.gradleProperty('version').getOrElse('3.4.4')

def javaTarget = providers.gradleProperty('javaVersion').map { it.toInteger() }.getOrElse(17)
def legacyLibsDir = layout.buildDirectory.dir('legacy-libs')

/**
 * The repository stores the legacy runtime dependencies in one deterministic
 * archive.  Keeping extraction in Gradle makes a clean checkout reproducible
 * without committing the generated libs/ directory.
 */
def prepareLegacyLibs = tasks.register('prepareLegacyLibs', Sync) {
    inputs.file(layout.projectDirectory.file('libs.zip'))
    from { zipTree(layout.projectDirectory.file('libs.zip')) }
    into(legacyLibsDir)
}

def legacyFile = { String name ->
    files(legacyLibsDir.map { it.file(name) })
}

sourceSets {
    main {
        java {
            // Preserve the current source tree during the migration.  Moving
            // files to src/main/java can happen independently later.
            srcDirs = ['src']
            exclude 'installer/**'
        }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
            exclude 'installer/**'
            // The manifest is supplied by the Jar task below so it can carry
            // the Gradle project version consistently.
            exclude 'META-INF/MANIFEST.MF'
        }
    }
    installer {
        java.srcDirs = ['src/installer/java']
        resources.srcDirs = ['src/installer/resources']
        // The installer uses the loader classes only through its packaged
        // resource, but keeping main output available preserves the old
        // source-set contract for future installer code.
        compileClasspath = sourceSets.main.output + configurations.installerCompileClasspath
    }
    test {
        java.srcDirs = ['src/test/java']
        resources.srcDirs = ['src/test/resources']
    }
}

configurations {
    shaded
    implementation.extendsFrom(shaded)
    gameRuntime
    natives
}

dependencies {
    // The MITE classes are needed to compile loader integrations, but the
    // game itself remains outside the published loader JAR.
    compileOnly legacyFile('1.6.4-MITE.jar')
    compileOnly legacyFile('MITE-HDS.jar')
    gameRuntime legacyFile('MITE-HDS.jar')
    gameRuntime legacyFile('1.6.4-MITE.jar')

    shaded legacyFile('gson-2.2.2.jar')
    shaded legacyFile('guava-28.0-jre.jar')
    shaded legacyFile('failureaccess-1.0.1.jar')
    shaded legacyFile('jsr305-3.0.2.jar')

    shaded legacyFile('access-widener-2.1.0.jar')
    shaded legacyFile('Fabric-ASM-v2.3.jar')
    shaded legacyFile('mapping-io-0.5.0.jar')
    shaded legacyFile('tiny-remapper-0.10.4+local.jar')

    shaded legacyFile('asm-9.6.jar')
    shaded legacyFile('asm-analysis-9.6.jar')
    shaded legacyFile('asm-commons-9.6.jar')
    shaded legacyFile('asm-tree-9.6.jar')
    shaded legacyFile('asm-util-9.6.jar')

    shaded legacyFile('org.ow2.sat4j.core-2.3.6.jar')
    shaded legacyFile('org.ow2.sat4j.pb-2.3.6.jar')
    shaded legacyFile('commons-lang3-3.13.0.jar')
    shaded legacyFile('log4j-api-2.23.1.jar')
    shaded legacyFile('log4j-core-2.23.1.jar')

    // LWJGL's Java classes are part of the historical standalone artifact.
    // Native binaries remain external and are selected by runClient.
    shaded legacyFile('lwjgl-2.9.0.jar')
    shaded legacyFile('lwjgl_util-2.9.0.jar')

    installerImplementation legacyFile('gson-2.2.2.jar')

    natives legacyFile('lwjgl-platform-2.9.0-natives-windows.jar')
}

java {
    sourceCompatibility = JavaVersion.toVersion(javaTarget)
    targetCompatibility = JavaVersion.toVersion(javaTarget)
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaTarget)
    }
    withSourcesJar()
}

application {
    mainClass = 'net.xiaoyu233.fml.relaunch.server.Main'
}

tasks.withType(JavaCompile).configureEach {
    dependsOn(prepareLegacyLibs)
    options.encoding = 'UTF-8'
    options.compilerArgs.addAll(['-Xlint:-options'])
    // MITE-HDS embeds an old Guava copy. Keep the explicitly selected
    // Guava API first so EventBus and related sources resolve consistently.
    if (name == 'compileJava') {
        classpath = files(legacyFile('guava-28.0-jre.jar'), classpath)
    }
}

tasks.withType(ProcessResources).configureEach {
    dependsOn(prepareLegacyLibs)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('processInstallerResources', ProcessResources) {
    inputs.property('releaseVersion', project.version)
    filesMatching('config.json') {
        filter { line -> line.replace('@FML_VERSION@', "v${project.version}") }
    }
    filesMatching('version.properties') {
        filter { line -> line.replace('@FML_VERSION@', "v${project.version}") }
    }
}

tasks.named('jar', Jar) {
    archiveBaseName = 'FishModLoader'
    manifest {
        from(layout.projectDirectory.file('src/META-INF/MANIFEST.MF'))
        attributes(
            'Implementation-Version': project.version,
            'Build-Gradle': 'true'
        )
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/**
 * Published loader artifact.  Dependencies are unpacked into one executable
 * JAR, matching the historical IntelliJ artifact while avoiding duplicate
 * signature files from third-party libraries.
 */
def shadowJar = tasks.register('shadowJar', Jar) {
    group = 'build'
    description = 'Build the self-contained FishModLoader Fat JAR.'
    archiveBaseName = 'FishModLoader'
    archiveClassifier = 'all'
    dependsOn(tasks.named('classes'), prepareLegacyLibs)

    from(sourceSets.main.output)
    from {
        configurations.shaded.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    // MITE's FontRenderer expects its own 144-character font table. The
    // loader source tree also contains a large CJK font.txt for tooling, but
    // exposing it at runtime makes the language screen index past 256.
    exclude 'font.txt'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    exclude 'META-INF/LICENSE*', 'META-INF/NOTICE*'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        from(layout.projectDirectory.file('src/META-INF/MANIFEST.MF'))
        attributes(
            'Implementation-Version': project.version,
            'Build-Gradle': 'true'
        )
    }
}

/**
 * HDS carries the legacy launcher/support libraries, but it also contains a
 * second Minecraft client/server and font.txt. Keep only its support classes
 * available to the client so neither game classes nor resources are shadowed.
 */
def legacySupportJar = tasks.register('legacySupportJar', Jar) {
    group = 'build'
    description = 'Build the filtered HDS support runtime.'
    archiveBaseName = 'MITE-HDS-support'
    dependsOn(prepareLegacyLibs)
    from { zipTree(legacyFile('MITE-HDS.jar').singleFile) }
    exclude 'net/minecraft/**', 'font.txt', 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

/**
 * Historical release artifact names are retained for compatibility with
 * existing launcher profiles, server documentation, and GitHub releases.
 */
def releaseLoaderJar = tasks.register('releaseLoaderJar') {
    group = 'release'
    description = 'Create the versioned universal FishModLoader JAR.'
    dependsOn(shadowJar)
    def target = layout.buildDirectory.file("libs/FishModLoader-v${project.version}.jar")
    inputs.file(shadowJar.flatMap { it.archiveFile })
    outputs.file(target)
    doLast {
        copy {
            from(shadowJar.get().archiveFile)
            into(target.get().asFile.parentFile)
            rename { target.get().asFile.name }
        }
    }
}

def releaseServerJar = tasks.register('releaseServerJar', Jar) {
    group = 'release'
    description = 'Build the standalone MITE-HDS server JAR with FishModLoader embedded.'
    archiveFileName = "1.6.4-MITE-HDS_FMLv${project.version}.jar"
    dependsOn(shadowJar, prepareLegacyLibs)

    // Put FML first so its newer compatibility libraries win over the old
    // copies embedded in MITE-HDS. MITE game classes and font.txt follow.
    from { zipTree(shadowJar.get().archiveFile.get().asFile) }
    from { zipTree(legacyFile('MITE-HDS.jar').singleFile) }
    exclude 'META-INF/MANIFEST.MF'
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        from(layout.projectDirectory.file('src/META-INF/MANIFEST.MF'))
        attributes(
            'Main-Class': 'net.xiaoyu233.fml.relaunch.server.JarMain',
            'Implementation-Version': project.version,
            'Build-Gradle': 'true'
        )
    }
}

def installerJar = tasks.register('installerJar', Jar) {
    group = 'release'
    description = 'Build the executable universal FishModLoader installer.'
    archiveFileName = "FishModLoader-v${project.version}-installer-universal.jar"
    dependsOn(tasks.named('installerClasses'), shadowJar, prepareLegacyLibs)

    from(sourceSets.installer.output) {
        exclude 'META-INF/MANIFEST.MF'
    }
    from {
        configurations.installerRuntimeClasspath.collect { file ->
            file.isDirectory() ? file : zipTree(file)
        }
    }
    from(shadowJar.flatMap { it.archiveFile }) {
        into 'net/xiaoyu233/fmlinstaller'
        rename { 'FishModLoader.jar' }
    }
    from(legacyFile('guava-28.0.jar')) {
        into 'net/xiaoyu233/fmlinstaller'
    }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes(
            'Main-Class': 'net.xiaoyu233.fmlinstaller.Main',
            'Implementation-Version': project.version,
            'Build-Gradle': 'true'
        )
    }
}

def verifyVersionConsistency = tasks.register('verifyVersionConsistency') {
    group = 'verification'
    description = 'Verify Gradle, source, and manifest versions are synchronized.'
    inputs.files(
            layout.projectDirectory.file('VERSION.txt'),
            layout.projectDirectory.file('src/net/xiaoyu233/fml/util/Constants.java'),
            layout.projectDirectory.file('src/META-INF/MANIFEST.MF')
    )
    inputs.property('releaseVersion', project.version)
    doLast {
        def expected = project.version.toString()
        def versionText = layout.projectDirectory.file('VERSION.txt').asFile.text.trim()
        def constantsText = layout.projectDirectory.file('src/net/xiaoyu233/fml/util/Constants.java').asFile.text
        def manifestText = layout.projectDirectory.file('src/META-INF/MANIFEST.MF').asFile.text
        if (versionText != expected) {
            throw new GradleException("VERSION.txt is ${versionText}, expected ${expected}")
        }
        if (!constantsText.contains("VERSION = \"${expected}\";")) {
            throw new GradleException("Constants.VERSION is not ${expected}")
        }
        if (!manifestText.contains("Implementation-Version: ${expected}")) {
            throw new GradleException("Source manifest version is not ${expected}")
        }
    }
}

def release = tasks.register('release') {
    group = 'release'
    description = 'Build and verify all artifacts required for a FishModLoader GitHub release.'
    dependsOn(verifyVersionConsistency, releaseLoaderJar, releaseServerJar, installerJar)
    doLast {
        def expected = [
                "FishModLoader-v${project.version}.jar": [
                        'net/xiaoyu233/fml/FishModLoader.class',
                        'net/xiaoyu233/fml/relaunch/server/JarMain.class',
                        'com/google/gson/Gson.class'
                ],
                "FishModLoader-v${project.version}-installer-universal.jar": [
                        'net/xiaoyu233/fmlinstaller/Main.class',
                        'net/xiaoyu233/fmlinstaller/FishModLoader.jar',
                        'net/xiaoyu233/fmlinstaller/guava-28.0.jar',
                        'version.properties',
                        'config.json'
                ],
                "1.6.4-MITE-HDS_FMLv${project.version}.jar": [
                        'net/xiaoyu233/fml/FishModLoader.class',
                        'net/xiaoyu233/fml/relaunch/server/JarMain.class',
                        'net/minecraft/server/MinecraftServer.class'
                ]
        ]
        expected.each { name, requiredEntries ->
            def artifact = layout.buildDirectory.file("libs/${name}").get().asFile
            if (!artifact.isFile() || artifact.length() == 0) {
                throw new GradleException("Release artifact was not generated: ${artifact}")
            }
            new ZipFile(artifact).withCloseable { zip ->
                requiredEntries.each { entry ->
                    if (zip.getEntry(entry) == null) {
                        throw new GradleException("${artifact.name} is missing ${entry}")
                    }
                }
                if (name.contains('installer-universal')) {
                    def installerVersion = zip.getInputStream(zip.getEntry('version.properties')).getText('UTF-8').trim()
                    if (installerVersion != "version = v${project.version}") {
                        throw new GradleException("Installer version is incorrect: ${installerVersion}")
                    }
                    def config = zip.getInputStream(zip.getEntry('config.json')).getText('UTF-8')
                    if (!config.contains("fishmodloader:v${project.version}")) {
                        throw new GradleException("Installer config does not reference FishModLoader v${project.version}")
                    }
                }
            }
            logger.lifecycle("Release artifact: ${artifact.name} (${artifact.length()} bytes)")
        }
    }
}

tasks.named('build') {
    dependsOn(shadowJar, release)
}

tasks.register('verifyBundle') {
    group = 'verification'
    description = 'Verify the generated Fat JAR contains project classes, resources, and Gson.'
    dependsOn(shadowJar)
    doLast {
        def archive = shadowJar.get().archiveFile.get().asFile
        def entries = [] as Set
        zipTree(archive).visit { details ->
            if (!details.isDirectory()) {
                entries.add(details.relativePath.pathString)
            }
        }
        ['META-INF/MANIFEST.MF',
         'fishmodloader.mixin.json',
         'net/xiaoyu233/fml/FishModLoader.class',
         'com/google/gson/Gson.class'].each { required ->
            if (!entries.contains(required)) {
                throw new GradleException("Fat JAR is missing required entry: ${required}")
            }
        }
        logger.lifecycle("Verified ${archive.name} (${archive.length()} bytes, ${entries.size()} entries)")
    }
}

tasks.named('check') {
    dependsOn('verifyBundle')
}

tasks.register('extractNatives', Sync) {
    group = 'run'
    description = 'Extract available LWJGL native libraries for the legacy runtime.'
