buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'com.guardsquare:proguard-gradle:7.3.2'
    }
}

plugins {
    id 'java'
    id 'application'
    id 'maven-publish'
}

version = project.version
group = project.group

repositories {
    mavenCentral()
    maven {
        name = "Spongepowered"
        url = "https://repo.spongepowered.org/repository/maven-public/"
    }
    maven {
        name = "ModdedMITE"
        url = "https://maven.limingzxc.top/repository/maven-public/"
    }
    maven {
        name = 'legacy-fabric'
        url = 'https://maven.legacyfabric.net'
    }
    maven {
        name = 'fabric'
        url = 'https://maven.fabricmc.net'
    }
    maven {
        name = 'Minecraft'
        url = 'https://libraries.minecraft.net'
    }
}

ext {
    lwjglVersion = '3.4.3'
}

configurations {
    shaded
    implementation.extendsFrom shaded
    launchLibs
    natives
}

configurations.configureEach {
    // The LWJGL 2 core and platform natives come back transitively (lwjgl_util, paulscode librarylwjglopenal): the LWJGL 2 API is
    // provided by the FML compat classes (org.lwjgl.opengl/input/openal/Sys...) on top of LWJGL 3 + Vulkan, never resolve the real ones.
    exclude group: 'org.lwjgl.lwjgl', module: 'lwjgl'
    exclude group: 'org.lwjgl.lwjgl', module: 'lwjgl-platform'
}

dependencies {
//    implementation 'com.mojang:minecraft:1.6.4-MITE'
    implementation files('libs/1.6.4-MITE.jar')

    shaded 'com.google.code.gson:gson:2.11.0'
    shaded 'com.google.guava:guava:33.4.8-jre'

    shaded 'net.fabricmc:access-widener:2.1.0'
    shaded 'net.fabricmc:tiny-remapper:0.9.0'
    shaded 'net.fabricmc:mapping-io:0.7.1'

    shaded 'org.apache.logging.log4j:log4j-api:2.25.1'
    shaded 'org.apache.logging.log4j:log4j-core:2.25.1'
    shaded 'org.apache.commons:commons-lang3:3.18.0'
//    shaded 'org.apache.commons:commons-io:1.3.2'

    // LWJGL 2 core/platform are gone: org.lwjgl.opengl/input/Sys/openal are FML compat classes running on LWJGL 3 + Vulkan.
    // Only the pure-Java lwjgl_util 2.x (vector/glu) stays; it links against the compat GL11.
    shaded 'org.lwjgl.lwjgl:lwjgl_util:2.9.0'

    // LWJGL 3 (Vulkan backend). Java classes of lwjgl-openal and lwjgl-opengl are NOT shipped (the LWJGL 2 compat owns those
    // package names), lwjgl-openal contributes natives only. lwjgl-vulkan natives = MoltenVK, macOS only (Windows uses the system loader).
    shaded "org.lwjgl:lwjgl:${lwjglVersion}"
    shaded "org.lwjgl:lwjgl-glfw:${lwjglVersion}"
    shaded "org.lwjgl:lwjgl-vulkan:${lwjglVersion}"
    shaded "org.lwjgl:lwjgl-vma:${lwjglVersion}"
    ['natives-windows', 'natives-macos', 'natives-macos-arm64'].each { nativesClassifier ->
        shaded "org.lwjgl:lwjgl:${lwjglVersion}:${nativesClassifier}"
        shaded "org.lwjgl:lwjgl-glfw:${lwjglVersion}:${nativesClassifier}"
        shaded "org.lwjgl:lwjgl-vma:${lwjglVersion}:${nativesClassifier}"
        shaded "org.lwjgl:lwjgl-openal:${lwjglVersion}:${nativesClassifier}"
    }
    ['natives-macos', 'natives-macos-arm64'].each { nativesClassifier ->
        shaded "org.lwjgl:lwjgl-vulkan:${lwjglVersion}:${nativesClassifier}"
    }

    shaded 'org.ow2.asm:asm:9.9.1'
    shaded 'org.ow2.asm:asm-analysis:9.9.1'
    shaded 'org.ow2.asm:asm-commons:9.9.1'
    shaded 'org.ow2.asm:asm-util:9.9.1'
    shaded 'org.ow2.asm:asm-tree:9.9.1'

    shaded 'org.ow2.sat4j:org.ow2.sat4j.pb:2.3.6'
    shaded 'org.ow2.sat4j:org.ow2.sat4j.core:2.3.6'

    implementation 'it.unimi.dsi:fastutil:8.5.12'

    // 'natives' is intentionally empty now: LWJGL 3 natives are bundled in the FML jar and extracted at launch (NativeExtractor).

    //---------------------------------//
    launchLibs 'net.sf.jopt-simple:jopt-simple:5.0.4'
    launchLibs 'org.lwjgl.lwjgl:lwjgl_util:2.9.0'
    launchLibs 'net.java.jinput:jinput:2.0.9'
    launchLibs 'net.java.jutils:jutils:1.0.0'
    launchLibs 'com.ibm.icu:icu4j:51.1'
    launchLibs 'com.mojang:authlib:1.5.21'
    launchLibs 'com.mojang:patchy:1.1'
    launchLibs 'oshi-project:oshi-core:1.1'
    launchLibs 'net.java.dev.jna:jna:4.4.0'
    launchLibs 'net.java.dev.jna:platform:3.4.0'
    launchLibs 'com.mojang:text2speech:1.11.3'
    launchLibs 'com.paulscode:soundsystem:20120107'
    launchLibs 'com.paulscode:codecwav:20101023'
    launchLibs 'com.paulscode:libraryjavasound:20101123'
    launchLibs 'com.paulscode:librarylwjglopenal:20100824'
    launchLibs 'com.paulscode:codecjorbis:20101023'
    launchLibs 'argo:argo:2.25_fixed'
    launchLibs 'org.bouncycastle:bcprov-jdk15on:1.47'
}


tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

tasks.register('shadowJar', Jar) {
    group = 'fishmodloader'

    archiveClassifier = 'all'
    from sourceSets.main.output

    from {
        configurations.shaded.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        duplicatesStrategy = DuplicatesStrategy.WARN
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*LICENSE*'
        exclude 'META-INF/*NOTICE*'
        exclude 'META-INF/INDEX.LIST'
        exclude 'module-info.class'
        exclude 'META-INF/versions/*/module-info.class'
    }

    manifest {
        attributes 'Main-Class': 'net.xiaoyu233.fml.relaunch.DevLaunchInjector'
        // lwjgl-3.4.3.jar has META-INF/versions/{11,25,27}/org/lwjgl/system classes: they are only served from a multi-release jar
        attributes 'Multi-Release': 'true'
        // Honoured by the JDK only when the jar is the main jar of "java -jar" (JEP 472). FML normally sits on the class path
        // (launchers, runClient), where --enable-native-access=ALL-UNNAMED comes from tasks.gradle, the installer's version json
        // (arguments.jvm) and the macOS relaunch (MacFirstThread)
        attributes 'Enable-Native-Access': 'ALL-UNNAMED'
    }
}

// ---- Dev-only test bot source set (src/devtest) ----------------------------------------------------------------------------------
// Modelled on the dev test setup of the user's Twilight Forest port (mite-twilightforest/src/devtest): a second, separate dev mod (own fml.mod.json and
// mixin config) with a script thread, a report and screenshots, put on the runClient class path only with -Ptestbot. The shadow jar packs
// sourceSets.main.output and nothing else, so the bot never ships. Reports, screenshots and perf CSV go to ../docs (outside the repository).
sourceSets {
    devtest // src/devtest/java, src/devtest/resources
}
configurations.devtestCompileOnly.extendsFrom configurations.implementation
dependencies {
    devtestCompileOnly sourceSets.main.output
}

apply from: 'shaders.gradle'
apply from: 'tasks.gradle'