}

tasks.register('showClientJava') {
    group = 'run'
    description = 'Resolve and print the Java runtime that runClient will use.'
    doLast {
        def javaExecutable = resolveClientJava()
        logger.lifecycle("clientJava=${javaExecutable.absolutePath}")
        logger.lifecycle("clientJavaVersion=${javaMajorVersion(javaExecutable)}")
        logger.lifecycle("clientJavaArchitecture=${javaArchitecture(javaExecutable)}")
    }
}

tasks.register('verifyClientClasspath') {
    group = 'verification'
    description = 'Verify the client sees the original MITE JAR before FML resources.'
    dependsOn(shadowJar, legacySupportJar, prepareLegacyLibs)
    doLast {
        def entries = clientRuntimeClasspath().files.toList()
        def first = entries ? entries[0].name : '<empty>'
        if (first != '1.6.4-MITE.jar') {
            throw new GradleException("Client classpath must start with 1.6.4-MITE.jar, but starts with ${first}")
        }
        def support = legacySupportJar.get().archiveFile.get().asFile
        def supportEntries = [] as Set
        zipTree(support).visit { details ->
            if (!details.isDirectory()) supportEntries.add(details.relativePath.pathString)
        }
        ['font.txt', 'net/minecraft/client/main/Main.class', 'net/minecraft/server/MinecraftServer.class'].each { forbidden ->
            if (supportEntries.contains(forbidden)) {
                throw new GradleException("Filtered HDS support jar must not contain ${forbidden}")
            }
        }
        if (!supportEntries.contains('joptsimple/OptionSpec.class')) {
            throw new GradleException('Filtered HDS support jar is missing joptsimple/OptionSpec.class')
        }
        logger.lifecycle("Client classpath order: ${entries.collect { it.name }.join(' -> ')}")
        def lwjglJava = clientLwjglJava()
        if (hostIsAppleSilicon() && lwjglJava.empty) {
            throw new GradleException('Apple Silicon client requires the matching LWJGL 2.9.2-nightly Java jars from the installer. Run install.sh first or set -PlwjglDir=/path/to/libraries.')
        }
        def missingClientLibraries = requiredClientLibraryNames.findAll { required ->
            !clientExternalLibraries().any { it.name == required }
        }
        if (!missingClientLibraries.empty) {
            throw new GradleException("Client classpath is missing required installer libraries: ${missingClientLibraries.join(', ')}. Set -PminecraftLibrariesDir=/path/to/libraries.")
        }
    }
}
